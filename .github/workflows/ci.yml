name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'
      - name: Smoke tests
        run: pytest -q

  reference-in-sync:
    # Verify the vendored reference source still matches the EXACT topica version
    # pinned in pyproject.toml, so reference_implementation/ is provably the code
    # the package installs. The tag is derived from the pin, never hardcoded: bump
    # the pin without re-vendoring and this job fails.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve pinned topica version
        id: pin
        run: echo "version=$(bash scripts/pinned_topica.sh)" >> "$GITHUB_OUTPUT"
      - name: Check out pinned topica
        uses: actions/checkout@v4
        with:
          repository: nealcaren/topica
          ref: v${{ steps.pin.outputs.version }}
          path: _topica
      - name: Check reference snapshot
        run: bash scripts/check_reference.sh _topica "v${{ steps.pin.outputs.version }}"
