name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'
      - name: Smoke tests
        run: pytest -q

  reference-in-sync:
    # Verify the vendored reference source still matches the pinned topica tag,
    # so reference_implementation/ is provably the code the package runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned topica
        uses: actions/checkout@v4
        with:
          repository: nealcaren/topica
          ref: v0.58.0
          path: _topica
      - name: Check reference snapshot
        run: bash scripts/check_reference.sh _topica v0.58.0
